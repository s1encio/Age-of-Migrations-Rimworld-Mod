name: API dump
on:
  push:
    branches: [api-dump]
permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ver: ['1.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: restore
        run: dotnet restore tools/apidump/apidump.csproj -p:RimWorldVersion=${{ matrix.ver }} 2>&1 | tail -20; ls ~/.nuget/packages/ || true
      - name: decompile
        run: |
          dotnet tool install -g ilspycmd; export DOTNET_ROLL_FORWARD=Major
          export PATH="$PATH:$HOME/.dotnet/tools"; export DOTNET_ROLL_FORWARD=Major
          DLL=$(find ~/.nuget/packages/krafs.rimworld.ref -name Assembly-CSharp.dll | head -1)
          echo "DLL=$DLL"
          mkdir -p out
          for T in RimWorld.Planet.WorldGenerator RimWorld.Page_CreateWorldParams RimWorld.Page_SelectScenario RimWorld.Storyteller RimWorld.Page_SelectStoryteller RimWorld.PageUtility RimWorld.StartingPawnUtility RimWorld.ScenPart_ConfigPage_ConfigureStartingPawns RimWorld.Page_ChooseIdeoPreset RimWorld.MainMenuDrawer Verse.LongEventHandler RimWorld.Page Verse.Game RimWorld.DifficultyDef RimWorld.StorytellerDef RimWorld.IdeoGenerator RimWorld.IdeoGenerationParms RimWorld.IdeoUtility RimWorld.Planet.WorldGenStep RimWorld.ScenPart_ConfigPage RimWorld.Scenario RimWorld.Page_ConfigureStartingPawns RimWorld.FactionIdeosTracker RimWorld.Planet.LandmarkDensity RimWorld.Planet.OverallRainfall RimWorld.Planet.OverallPopulation RimWorld.Planet.OverallTemperature RimWorld.Planet.WorldFactionsUIUtility RimWorld.IdeoFoundation RimWorld.FactionGenerator RimWorld.Planet.WorldGenData; do
            echo "=================== $T"
            ilspycmd -t "$T" "$DLL" 2>&1 | grep -v "^\s*$" | sed 's/{ throw null; }//' | head -400 || true
          done > out/api.txt
          wc -l out/api.txt
      - name: save
        if: always()
        run: |
          mkdir -p dump; cp out/api.txt dump/api-${{ matrix.ver }}.txt 2>/dev/null || echo "no output" > dump/api-${{ matrix.ver }}.txt
          git config user.name "s1encio"; git config user.email "urlocalkgbagent@gmail.com"
          git pull -q --rebase origin api-dump || true
          git add -f dump && git commit -m "api dump ${{ matrix.ver }} [skip ci]" && git push origin HEAD:api-dump
