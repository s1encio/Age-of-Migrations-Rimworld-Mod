name: API dump
on:
  push:
    branches: [api-dump]
permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ver: ['1.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: restore
        run: dotnet restore tools/apidump/apidump.csproj -p:RimWorldVersion=${{ matrix.ver }} 2>&1 | tail -20; ls ~/.nuget/packages/ || true
      - name: decompile
        run: |
          dotnet tool install -g ilspycmd; export DOTNET_ROLL_FORWARD=Major
          export PATH="$PATH:$HOME/.dotnet/tools"; export DOTNET_ROLL_FORWARD=Major
          DLL=$(find ~/.nuget/packages/krafs.rimworld.ref -name Assembly-CSharp.dll | head -1)
          echo "DLL=$DLL"
          mkdir -p out
          for T in RimWorld.Planet.WorldDrawLayer RimWorld.Planet.WorldDrawLayer_Roads RimWorld.Planet.WorldDrawLayer_SingleTile RimWorld.Planet.WorldDrawLayer_Hills RimWorld.Planet.LayerSubMesh RimWorld.Planet.WorldRendererUtility RimWorld.Planet.PlanetLayer RimWorld.Planet.SurfaceLayer RimWorld.Planet.WorldGrid RimWorld.Planet.PlanetTile RimWorld.Planet.WorldRenderer RimWorld.Planet.TileFinder RimWorld.Page_SelectStartingSite RimWorld.Scenario RimWorld.ScenPart RimWorld.ScenPart_PlayerFaction RimWorld.ScenPart_StartingAnimal RimWorld.ScenPartDef RimWorld.IncidentWorker_RaidEnemy RimWorld.IncidentWorker_Raid RimWorld.IncidentWorker_PawnsArrive RimWorld.IncidentParms RimWorld.IncidentDef RimWorld.Difficulty RimWorld.AnomalyPlaystyleDef RimWorld.Faction RimWorld.FactionManager RimWorld.GameInitData RimWorld.Planet.WorldObjectsHolder RimWorld.Planet.Settlement RimWorld.FactionDef RimWorld.Planet.WorldGenStep_Factions RimWorld.Planet.FactionGenerator RimWorld.Page_ConfigureStartingPawns RimWorld.StorytellerComp_OnOffCycle RimWorld.StorytellerComp_FactionInteraction Verse.ModsConfig RimWorld.Planet.WorldLayerSettingsDef RimWorld.Planet.WorldMaterials RimWorld.Planet.WorldDrawLayer_CurrentMapTile RimWorld.Planet.WorldDrawLayer_Rivers RimWorld.Planet.WorldDrawLayer_Paths RimWorld.Planet.WorldFeatures; do
            echo "=================== $T"
            ilspycmd -t "$T" "$DLL" 2>&1 | grep -v "^\s*$" | sed 's/{ throw null; }//' | head -400 || true
          done > out/api.txt
          wc -l out/api.txt
      - name: save
        if: always()
        run: |
          mkdir -p dump; cp out/api.txt dump/api-${{ matrix.ver }}.txt 2>/dev/null || echo "no output" > dump/api-${{ matrix.ver }}.txt
          git config user.name "s1encio"; git config user.email "urlocalkgbagent@gmail.com"
          git pull -q --rebase origin api-dump || true
          git add -f dump && git commit -m "api dump ${{ matrix.ver }} [skip ci]" && git push origin HEAD:api-dump
