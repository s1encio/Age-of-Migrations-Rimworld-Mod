name: API dump
on:
  push:
    branches: [api-dump]
permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ver: ['1.6', '1.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: restore
        run: dotnet restore tools/apidump/apidump.csproj -p:RimWorldVersion=${{ matrix.ver }} 2>&1 | tail -20; ls ~/.nuget/packages/ || true
      - name: decompile
        run: |
          dotnet tool install -g ilspycmd --version 8.2.0.7535 || dotnet tool install -g ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          DLL=$(find ~/.nuget/packages/krafs.rimworld.ref -name Assembly-CSharp.dll | head -1)
          echo "DLL=$DLL"
          mkdir -p out
          for T in RimWorld.Planet.WorldGrid RimWorld.Planet.Tile RimWorld.Planet.SurfaceTile RimWorld.Planet.PlanetLayer RimWorld.Planet.SurfaceLayer RimWorld.Planet.PlanetTile \
                   RimWorld.Planet.WorldGenStep_Terrain RimWorld.Planet.WorldGenStep_Rivers RimWorld.Planet.WorldGenStep_Factions RimWorld.Planet.WorldGenStep_Roads \
                   RimWorld.Planet.WorldGenStep_Features RimWorld.Planet.WorldGenStep_Lakes RimWorld.Planet.WorldGenStep RimWorld.WorldGenStepDef RimWorld.Planet.WorldGenerator \
                   RimWorld.Planet.Settlement RimWorld.Planet.SettlementUtility RimWorld.Planet.WorldObjectsHolder RimWorld.Planet.WorldFeature RimWorld.Planet.WorldFeatures \
                   RimWorld.RiverDef RimWorld.Planet.Hilliness RimWorld.GenTemperature RimWorld.Planet.TileFinder RimWorld.FactionGenerator RimWorld.Planet.WorldComponent \
                   RimWorld.Planet.World RimWorld.Planet.WorldInfo RimWorld.Planet.WorldGenStep_Components RimWorld.Planet.PlanetShapeGenerator RimWorld.Planet.WorldPathGrid \
                   RimWorld.Planet.WorldGenStep_AncientRoads RimWorld.Planet.WorldGenStep_AncientSites RimWorld.FeatureWorker RimWorld.FeatureDef RimWorld.Planet.WorldLayer_Rivers \
                   RimWorld.Planet.Tile/RiverLink RimWorld.Planet.Tile/RoadLink RimWorld.BiomeDef RimWorld.Planet.Page_CreateWorldParams RimWorld.Page_CreateWorldParams; do
            echo "=================== $T"
            ilspycmd -t "$T" "$DLL" 2>&1 | grep -v "^\s*$" | sed 's/{ throw null; }//' | head -400 || true
          done > out/api.txt
          wc -l out/api.txt
      - name: save
        if: always()
        run: |
          mkdir -p dump; cp out/api.txt dump/api-${{ matrix.ver }}.txt 2>/dev/null || echo "no output" > dump/api-${{ matrix.ver }}.txt
          git config user.name "s1encio"; git config user.email "urlocalkgbagent@gmail.com"
          git pull -q --rebase origin api-dump || true
          git add -f dump && git commit -m "api dump ${{ matrix.ver }} [skip ci]" && git push origin HEAD:api-dump
